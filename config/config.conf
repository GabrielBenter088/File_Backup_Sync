# ============================================================
# File Backup & Sync — Configuration
# ============================================================
# Copy this file to config/config.local.conf and adjust the
# values below. config.local.conf is git-ignored so your
# personal paths and credentials never end up in the repo.
# ============================================================

# --- Source -----------------------------------------------------------
# Absolute path(s) to the directories you want to back up.
# Separate multiple paths with a space.
SOURCE_DIRS="/home/user/Documents /home/user/Pictures"

# --- Destination type -------------------------------------------------
# Choose one: "rsync" (NAS / local / SFTP) or "rclone" (cloud)
DEST_TYPE="rsync"

# --- rsync destination (used when DEST_TYPE=rsync) --------------------
# Examples:
#   Local path  : /mnt/nas/backup
#   SFTP / SSH  : user@nas.local:/volume1/backup
RSYNC_DEST="/mnt/nas/backup"

# Extra rsync options (appended to the default set).
# Default flags already used: -a --delete --progress
RSYNC_EXTRA_OPTS=""

# --- rclone destination (used when DEST_TYPE=rclone) ------------------
# Format: <remote-name>:<path>   (configure the remote with: rclone config)
# Example: "gdrive:backup" or "s3:mybucket/backup"
RCLONE_DEST="gdrive:backup"

# Extra rclone options (appended to the default set).
# Default flags already used: --progress
RCLONE_EXTRA_OPTS=""

# --- Logging ----------------------------------------------------------
# LOG_DIR is relative to the sync.sh script directory when not set here.
# Override with an absolute path if needed (e.g. /var/log/file_backup_sync).
LOG_DIR=""          # leave empty to use <script-dir>/logs
LOG_LEVEL="INFO"    # DEBUG | INFO | WARN | ERROR

# --- Retention --------------------------------------------------------
# Keep the N most-recent log files; older ones are deleted automatically.
LOG_RETENTION=6

# --- Lock file --------------------------------------------------------
# Prevents two sync processes from running simultaneously.
LOCK_FILE="/tmp/file_backup_sync.lock"

# --- Notifications (optional) -----------------------------------------
# Set to "true" to send a desktop notification on completion/failure.
NOTIFY_DESKTOP="false"

# Set to "true" + fill NOTIFY_EMAIL_* to receive email reports.
NOTIFY_EMAIL="false"
NOTIFY_EMAIL_TO="admin@example.com"
NOTIFY_EMAIL_FROM="backup@example.com"
NOTIFY_EMAIL_SUBJECT="[Backup] Sync report"
